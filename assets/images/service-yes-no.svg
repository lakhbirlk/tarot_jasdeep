<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A balanced set of scales with a single card at its centre">
  <defs>
    <linearGradient id="yn-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#232a5e"/>
      <stop offset="1" stop-color="#0a0821"/>
    </linearGradient>
    <linearGradient id="yn-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9b6"/>
      <stop offset="0.55" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9d7a1c"/>
    </linearGradient>
    <linearGradient id="yn-card" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2c2166"/>
      <stop offset="1" stop-color="#0b0925"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#yn-bg)"/>
  <g fill="#f4ecd0" opacity="0.6">
    <circle cx="84" cy="76" r="2.4"/><circle cx="556" cy="66" r="2"/><circle cx="500" cy="340" r="1.8"/>
    <circle cx="128" cy="330" r="2"/><circle cx="320" cy="44" r="2.2"/>
  </g>

  <!-- scales -->
  <g fill="none" stroke="url(#yn-gold)" stroke-width="2.6" stroke-linecap="round">
    <path d="M320 108v186"/>
    <path d="M172 138h296"/>
    <path d="M272 306h96"/>
  </g>
  <g fill="none" stroke="#e9d79a" stroke-width="2.2" stroke-linecap="round">
    <path d="M172 138v34"/><path d="M468 138v34"/>
    <path d="M136 172h72l-36 46z" fill="none"/>
    <path d="M432 172h72l-36 46z" fill="none"/>
  </g>
  <circle cx="320" cy="90" r="14" fill="none" stroke="#e9d79a" stroke-width="2.2"/>

  <!-- centre card -->
  <g transform="translate(320 214)">
    <rect x="-40" y="-58" width="80" height="132" rx="8" fill="url(#yn-card)" stroke="url(#yn-gold)" stroke-width="2.2"/>
    <path d="M0 -18l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#e9d79a" opacity="0.85"/>
  </g>
</svg>
