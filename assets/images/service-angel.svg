<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A halo, two wings and a falling feather">
  <defs>
    <linearGradient id="an-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3a2456"/>
      <stop offset="1" stop-color="#0a0821"/>
    </linearGradient>
    <linearGradient id="an-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf4d8"/>
      <stop offset="0.55" stop-color="#e6c46a"/>
      <stop offset="1" stop-color="#a3801f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#an-bg)"/>
  <g fill="#f4ecd0" opacity="0.62">
    <circle cx="80" cy="80" r="2.4"/><circle cx="560" cy="70" r="2"/><circle cx="540" cy="330" r="1.8"/>
    <circle cx="104" cy="320" r="2"/><circle cx="320" cy="40" r="2.2"/>
  </g>

  <!-- halo -->
  <ellipse cx="320" cy="122" rx="62" ry="18" fill="none" stroke="url(#an-gold)" stroke-width="2.6"/>
  <ellipse cx="320" cy="122" rx="74" ry="24" fill="none" stroke="#e9d79a" stroke-width="1" opacity="0.5"/>

  <!-- wings -->
  <g fill="none" stroke="url(#an-gold)" stroke-width="2.4" stroke-linecap="round">
    <path d="M262 168c-46-26-92-22-124 10 34 6 60 20 78 42"/>
    <path d="M378 168c46-26 92-22 124 10-34 6-60 20-78 42"/>
  </g>
  <g fill="none" stroke="#c9a94a" stroke-width="1.3" opacity="0.8" stroke-linecap="round">
    <path d="M188 186l58 34"/><path d="M164 196l52 40"/><path d="M208 178l50 28"/>
    <path d="M452 186l-58 34"/><path d="M476 196l-52 40"/><path d="M432 178l-50 28"/>
  </g>

  <!-- feather -->
  <g fill="none" stroke="#e9d79a" stroke-width="2.2" stroke-linecap="round">
    <path d="M320 200v112"/>
    <path d="M320 214c-20 12-30 30-30 48 18-4 30-18 30-36"/>
    <path d="M320 240c18 12 26 28 26 44-16-4-26-16-26-32"/>
  </g>
  <circle cx="320" cy="322" r="5" fill="#e9d79a" opacity="0.9"/>
</svg>
