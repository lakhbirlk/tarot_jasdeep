<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-label="A crescent moon, scattered stars and three fanned tarot cards against a deep night sky">
  <defs>
    <radialGradient id="hero-sky" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3a2a78" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#1b1442" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1b1442" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9b6"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9d7a1c"/>
    </linearGradient>
    <linearGradient id="hero-card" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#241a52"/>
      <stop offset="1" stop-color="#0a0821"/>
    </linearGradient>
    <linearGradient id="hero-moon" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fdf4d8"/>
      <stop offset="0.6" stop-color="#f1da97"/>
      <stop offset="1" stop-color="#cfa93a"/>
    </linearGradient>
    <filter id="hero-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="450" cy="330" r="340" fill="url(#hero-sky)"/>

  <!-- Constellation -->
  <g stroke="#8fc4f0" stroke-width="1.2" opacity="0.5" fill="none">
    <path d="M150 150 L215 205 L300 175 L360 235"/>
    <path d="M640 128 L700 190 L780 165"/>
  </g>
  <g fill="#eae4ff">
    <circle cx="150" cy="150" r="3.4"/>
    <circle cx="215" cy="205" r="2.6"/>
    <circle cx="300" cy="175" r="3"/>
    <circle cx="360" cy="235" r="2.4"/>
    <circle cx="640" cy="128" r="3.2"/>
    <circle cx="700" cy="190" r="2.4"/>
    <circle cx="780" cy="165" r="2.8"/>
  </g>

  <!-- Scattered stars -->
  <g fill="#f4ecd0">
    <path d="M120 420l2.6 6.6 6.6 2.6-6.6 2.6-2.6 6.6-2.6-6.6-6.6-2.6 6.6-2.6z" opacity="0.9"/>
    <path d="M790 380l2.2 5.6 5.6 2.2-5.6 2.2-2.2 5.6-2.2-5.6-5.6-2.2 5.6-2.2z" opacity="0.8"/>
    <path d="M250 96l1.9 4.8 4.8 1.9-4.8 1.9-1.9 4.8-1.9-4.8-4.8-1.9 4.8-1.9z" opacity="0.75"/>
    <circle cx="420" cy="88" r="2.2" opacity="0.7"/>
    <circle cx="560" cy="70" r="1.8" opacity="0.6"/>
    <circle cx="676" cy="300" r="2" opacity="0.65"/>
    <circle cx="176" cy="300" r="1.8" opacity="0.6"/>
    <circle cx="822" cy="520" r="2.2" opacity="0.55"/>
    <circle cx="82" cy="560" r="2" opacity="0.5"/>
  </g>

  <!-- Moon -->
  <g filter="url(#hero-glow)">
    <path d="M690 130a120 120 0 1 1 0 240 152 152 0 0 0 0-240z" fill="url(#hero-moon)" opacity="0.95"/>
  </g>
  <circle cx="700" cy="250" r="150" fill="none" stroke="url(#hero-gold)" stroke-width="1" opacity="0.35"/>
  <circle cx="700" cy="250" r="176" fill="none" stroke="url(#hero-gold)" stroke-width="0.8" opacity="0.18"/>

  <!-- Three fanned tarot cards -->
  <g transform="translate(450 470)">
    <g transform="rotate(-20) translate(-190 0)">
      <rect x="-84" y="-124" width="168" height="272" rx="14" fill="url(#hero-card)" stroke="url(#hero-gold)" stroke-width="2.4"/>
      <rect x="-72" y="-112" width="144" height="248" rx="9" fill="none" stroke="#c9a94a" stroke-width="0.8" opacity="0.6"/>
      <path d="M0 -22l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#e9d79a" opacity="0.85"/>
      <circle cx="0" cy="66" r="16" fill="none" stroke="#c9a94a" stroke-width="1.2" opacity="0.7"/>
    </g>

    <g transform="rotate(-6) translate(-70 0)">
      <rect x="-84" y="-124" width="168" height="272" rx="14" fill="url(#hero-card)" stroke="url(#hero-gold)" stroke-width="2.4"/>
      <rect x="-72" y="-112" width="144" height="248" rx="9" fill="none" stroke="#c9a94a" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="-18" r="30" fill="none" stroke="#e9d79a" stroke-width="1.6" opacity="0.85"/>
      <path d="M-34 62h68" stroke="#c9a94a" stroke-width="1.4" opacity="0.7"/>
      <path d="M0 32v96" stroke="#c9a94a" stroke-width="1.2" opacity="0.55"/>
    </g>

    <g transform="rotate(9) translate(60 0)">
      <rect x="-84" y="-124" width="168" height="272" rx="14" fill="url(#hero-card)" stroke="url(#hero-gold)" stroke-width="2.4"/>
      <rect x="-72" y="-112" width="144" height="248" rx="9" fill="none" stroke="#c9a94a" stroke-width="0.8" opacity="0.6"/>
      <path d="M0 -70l10 26 26 10-26 10-10 26-10-26-26-10 26-10z" fill="none" stroke="#e9d79a" stroke-width="1.6"/>
      <path d="M-40 74q20 -18 40 0t40 0" fill="none" stroke="#c9a94a" stroke-width="1.3" opacity="0.7"/>
    </g>
  </g>

  <!-- Base glow -->
  <ellipse cx="450" cy="712" rx="250" ry="18" fill="#7d60d4" opacity="0.18"/>
</svg>
