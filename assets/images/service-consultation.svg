<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Two chairs facing each other with a candle and cards on a small table">
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#241f5e"/>
      <stop offset="1" stop-color="#0a0821"/>
    </linearGradient>
    <linearGradient id="cs-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9b6"/>
      <stop offset="0.55" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9d7a1c"/>
    </linearGradient>
    <radialGradient id="cs-flame" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#fdf4d8"/>
      <stop offset="0.5" stop-color="#e6a14a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e6a14a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#cs-bg)"/>
  <g fill="#f4ecd0" opacity="0.6">
    <circle cx="320" cy="42" r="2.2"/><circle cx="92" cy="86" r="2.4"/><circle cx="552" cy="92" r="2"/>
    <circle cx="86" cy="304" r="1.8"/><circle cx="560" cy="300" r="2"/>
  </g>

  <!-- window arch -->
  <path d="M270 66a50 50 0 0 1 100 0v66h-100z" fill="none" stroke="#c9a94a" stroke-width="1.4" opacity="0.45"/>
  <path d="M320 66v66" stroke="#c9a94a" stroke-width="1" opacity="0.35"/>

  <!-- chairs -->
  <g fill="none" stroke="url(#cs-gold)" stroke-width="2.4" stroke-linecap="round">
    <path d="M148 176v124"/><path d="M148 176h70v20h-70z"/>
    <path d="M156 248h54"/><path d="M162 300v-52"/><path d="M204 300v-52"/>
    <path d="M492 176v124"/><path d="M422 176h70v20h-70z"/>
    <path d="M430 248h54"/><path d="M436 300v-52"/><path d="M478 300v-52"/>
  </g>

  <!-- table -->
  <g fill="none" stroke="#e9d79a" stroke-width="2.4" stroke-linecap="round">
    <path d="M240 262h160"/>
    <path d="M262 262v46"/><path d="M378 262v46"/>
  </g>

  <!-- candle -->
  <g>
    <ellipse cx="320" cy="238" rx="26" ry="26" fill="url(#cs-flame)" opacity="0.55"/>
    <path d="M320 200c0 10-7 14-7 22a7 7 0 0 0 14 0c0-8-7-12-7-22z" fill="#f1da97" opacity="0.95"/>
    <rect x="314" y="226" width="12" height="34" rx="3" fill="none" stroke="#e9d79a" stroke-width="1.8"/>
  </g>

  <!-- cards on the table -->
  <g fill="none" stroke="url(#cs-gold)" stroke-width="1.8">
    <rect x="272" y="238" width="30" height="24" rx="4" transform="rotate(-12 287 250)"/>
    <rect x="286" y="236" width="30" height="24" rx="4" transform="rotate(6 301 248)"/>
  </g>

  <path d="M120 322h400" stroke="#c9a94a" stroke-width="1.3" opacity="0.5"/>
</svg>
