  <g fill="#0d0b28" fill-opacity="0.92" stroke="#e9d79a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M374 660v-34c0-16-12-26-28-26h-26c-14 0-22 10-22 24v36"/>
    <circle cx="336" cy="592" r="16"/>
