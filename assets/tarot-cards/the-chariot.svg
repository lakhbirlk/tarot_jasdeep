<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 840" width="500" height="840" role="img" aria-label="The Chariot tarot card: a crowned figure in a chariot beneath a canopy of stars, drawn by two sphinxes">
  <defs>
