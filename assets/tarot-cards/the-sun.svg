<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 840" width="500" height="840" role="img" aria-label="The Sun tarot card: a radiant sun with a calm face above a child riding a horse among sunflowers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#241a52"/><stop offset="0.55" stop-color="#0e0b28"/><stop offset="1" stop-color="#06050f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#7d60d4" stop-opacity="0.42"/><stop offset="1" stop-color="#7d60d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9b6"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#9d7a1c"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5d98a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f5d98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="840" fill="url(#bg)"/>
  <rect width="500" height="840" fill="url(#glow)"/>
  <rect x="16" y="16" width="468" height="808" rx="18" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
  <rect x="30" y="30" width="440" height="780" rx="12" fill="none" stroke="#c9a94a" stroke-width="1" opacity="0.6"/>
  <g fill="#f1da97" opacity="0.85">
    <path d="M46 46l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z"/>
    <path d="M454 46l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z"/>
    <path d="M46 794l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z"/>
    <path d="M454 794l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z"/>
  </g>
  <text x="250" y="104" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="url(#gold)" letter-spacing="6">XIX</text>
  <path d="M120 128h260" stroke="#c9a94a" stroke-width="1" opacity="0.45"/>

  <!-- art -->
  <!-- the sun -->
  <g transform="translate(250 250)">
    <circle r="150" fill="url(#sun-glow)"/>
  </g>
  <g fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round">
    <circle cx="250" cy="250" r="58"/>
    <!-- straight rays -->
    <path d="M250 172v-30M250 328v30M172 250h-30M328 250h30"/>
    <path d="M195 195l-22-22M305 195l22-22M195 305l-22 22M305 305l22 22"/>
    <!-- wavy rays -->
    <path d="M250 158q-8-12 0-22 8 10 18 4M250 342q8 12 0 22-8-10-18-4"/>
    <path d="M158 250q-12-8-22 0 10 8 4 18M342 250q12-8 22 0-10 8-4 18"/>
    <path d="M185 185q-14 0-18 10 12 2 16 12M315 185q14 0 18 10-12 2-16 12"/>
    <path d="M185 315q-14 0-18-10 12-2 16-12M315 315q14 0 18-10-12-2-16-12"/>
  </g>
  <!-- face -->
  <g fill="none" stroke="#e9d79a" stroke-width="2.2" stroke-linecap="round">
    <path d="M226 238c4-6 12-6 16 0M274 238c-4-6-12-6-16 0"/>
    <path d="M226 244c0 4 4 6 8 6M282 244c0 4-4 6-8 6"/>
    <path d="M232 272c10 10 26 10 36 0"/>
  </g>

  <!-- garden wall -->
  <g fill="none" stroke="#c9a94a" stroke-width="1.8" opacity="0.55">
    <path d="M88 520h324v46H88z"/>
    <path d="M88 543h324"/>
  </g>

  <!-- horse -->
  <g fill="#0d0b28" fill-opacity="0.9" stroke="#e9d79a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 660c-6-30 4-48 26-54h108c26 0 40 20 40 48v6h-30v-24h-96v24h-30z"/>
    <path d="M330 618c14-6 26-18 30-32 4-12 0-22-10-24-8-2-14 4-14 12"/>
    <path d="M336 600c-8-6-16-6-22 0"/>
    <path d="M348 562c2-12 10-18 20-16"/>
    <path d="M330 618l16 42M198 660v-24M284 660v-24"/>
    <path d="M344 660l4-42"/>
  </g>
  <!-- banner -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round">
    <path d="M368 500v140"/>
    <path d="M368 512h56l-14 20 14 20h-56z"/>
  </g>

  <!-- child -->
  <g fill="#0d0b28" fill-opacity="0.95" stroke="#e9d79a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="252" cy="518" r="20"/>
    <path d="M252 538c-18 0-28 20-30 46-2 18-2 30-1 36h62c1-6 1-18-1-36-2-26-12-46-30-46z"/>
    <path d="M252 550l-22 34M252 550l26 30"/>
  </g>
  <!-- plume -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round">
    <path d="M238 500c-6-14-2-26 10-32 2 12 8 20 18 24"/>
  </g>

  <!-- sunflowers -->
  <g fill="none" stroke="#e9d79a" stroke-width="2.2" stroke-linecap="round">
    <path d="M112 700v-70"/>
    <path d="M112 652c-16-6-24-20-22-36 16-2 30 8 34 24M112 668c16-6 24-20 22-36-16-2-30 8-34 24"/>
    <path d="M112 630c-10-14-8-30 4-40 10 12 10 28-4 40z"/>
    <path d="M388 700v-70"/>
    <path d="M388 652c-16-6-24-20-22-36 16-2 30 8 34 24M388 668c16-6 24-20 22-36-16-2-30 8-34 24"/>
    <path d="M388 630c-10-14-8-30 4-40 10 12 10 28-4 40z"/>
  </g>

  <!-- ground -->
  <g fill="none" stroke="#c9a94a" stroke-width="1.8" opacity="0.5">
    <path d="M92 700h316"/>
    <path d="M116 720h112M272 720h112"/>
  </g>

  <text x="250" y="768" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="url(#gold)" letter-spacing="3">THE SUN</text>
</svg>
