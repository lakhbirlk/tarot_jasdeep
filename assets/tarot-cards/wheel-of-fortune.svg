<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 840" width="500" height="840" role="img" aria-label="Wheel of Fortune tarot card: a great wheel with lettered stations and four creatures in the corners">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#241a52"/><stop offset="0.55" stop-color="#0e0b28"/><stop offset="1" stop-color="#06050f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#7d60d4" stop-opacity="0.42"/><stop offset="1" stop-color="#7d60d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9b6"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#9d7a1c"/>
    </linearGradient>
  </defs>
  <rect width="500" height="840" fill="url(#bg)"/>
  <rect width="500" height="840" fill="url(#glow)"/>
  <rect x="16" y="16" width="468" height="808" rx="18" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
  <rect x="30" y="30" width="440" height="780" rx="12" fill="none" stroke="#c9a94a" stroke-width="1" opacity="0.6"/>
  <g fill="#f1da97" opacity="0.85">
    <path d="M46 46l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z"/>
    <path d="M454 46l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z"/>
    <path d="M46 794l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z"/>
    <path d="M454 794l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z"/>
  </g>
  <text x="250" y="104" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="url(#gold)" letter-spacing="6">X</text>
  <path d="M120 128h260" stroke="#c9a94a" stroke-width="1" opacity="0.45"/>

  <!-- art -->
  <!-- four corner clouds and creatures -->
  <g fill="none" stroke="#c9a94a" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
    <path d="M66 268a20 20 0 0 1 22-22 24 24 0 0 1 44-6 18 18 0 0 1 22 22z"/>
    <path d="M366 268a20 20 0 0 1 22-22 24 24 0 0 1 44-6 18 18 0 0 1 22 22z"/>
    <path d="M66 604a20 20 0 0 0 22 22 24 24 0 0 0 44 6 18 18 0 0 0 22-22z"/>
    <path d="M366 604a20 20 0 0 0 22 22 24 24 0 0 0 44 6 18 18 0 0 0 22-22z"/>
  </g>
  <!-- angel -->
  <g fill="none" stroke="#e9d79a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="112" cy="222" r="10"/>
    <path d="M96 246c10-14 22-14 32 0M96 246c-10-6-14-16-10-24M128 246c10-6 14-16 10-24"/>
  </g>
  <!-- eagle -->
  <g fill="none" stroke="#e9d79a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M388 246l22-24 22 24"/>
    <path d="M392 240c-8-10-4-22 6-26M428 240c8-10 4-22-6-26"/>
    <path d="M404 246h12"/>
  </g>
  <!-- bull -->
  <g fill="none" stroke="#e9d79a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="112" cy="580" r="11"/>
    <path d="M102 572c-10-6-16-16-14-26 8 2 14 8 18 16M122 572c10-6 16-16 14-26-8 2-14 8-18 16"/>
  </g>
  <!-- lion -->
  <g fill="none" stroke="#e9d79a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="410" cy="580" r="15"/>
    <circle cx="410" cy="580" r="9"/>
    <path d="M404 576h4M416 576h4M406 586c4 4 10 4 14 0"/>
  </g>

  <!-- the wheel -->
  <g fill="none" stroke="#c9a94a" stroke-width="1.2" opacity="0.5">
    <circle cx="250" cy="424" r="118"/>
  </g>
  <g fill="none" stroke="url(#gold)" stroke-width="2.6">
    <circle cx="250" cy="424" r="106"/>
    <circle cx="250" cy="424" r="76"/>
  </g>
  <g fill="#0d0b28" fill-opacity="0.75" stroke="none">
    <circle cx="250" cy="424" r="76"/>
  </g>
  <g fill="none" stroke="#e9d79a" stroke-width="2">
    <circle cx="250" cy="424" r="26"/>
  </g>
  <g fill="none" stroke="#e9d79a" stroke-width="1.8" opacity="0.9">
    <path d="M250 398V318M250 450v80M224 424h-80M276 424h80"/>
    <path d="M232 406l-58-58M268 406l58-58M232 442l-58 58M268 442l58 58"/>
  </g>
  <!-- hub emblem -->
  <g fill="#e9d79a" opacity="0.85">
    <path d="M250 410l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
  </g>

  <!-- lettered stations -->
  <g fill="#0d0b28" fill-opacity="0.95" stroke="url(#gold)" stroke-width="1.8">
    <circle cx="250" cy="300" r="17"/>
    <circle cx="374" cy="424" r="17"/>
    <circle cx="250" cy="548" r="17"/>
    <circle cx="126" cy="424" r="17"/>
  </g>
  <g font-family="Georgia,'Times New Roman',serif" font-size="19" fill="url(#gold)" text-anchor="middle">
    <text x="250" y="307">T</text>
    <text x="374" y="431">A</text>
    <text x="250" y="555">R</text>
    <text x="126" y="431">O</text>
  </g>

  <!-- descending serpent -->
  <g fill="none" stroke="#e9d79a" stroke-width="2.2" stroke-linecap="round">
    <path d="M104 236c-16 34-16 62 4 84 20 22 20 44 2 62"/>
  </g>
  <g fill="#e9d79a" opacity="0.9">
    <path d="M110 382l-12 12 16 4z"/>
  </g>

  <text x="250" y="768" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="url(#gold)" letter-spacing="2">WHEEL OF FORTUNE</text>
</svg>
