    <circle cx="264" cy="222" r="16"/>
  </g>

  <!-- woman -->
  <g fill="#0d0b28" fill-opacity="0.95" stroke="#e9d79a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="250" cy="290" r="22"/>
    <path d="M250 312c-26 0-44 26-48 64-3 30-3 66-2 96h100c1-30 1-66-2-96-4-38-22-64-48-64z"/>
    <path d="M250 326l-52 44M250 326l54 34"/>
  </g>

