  <g fill="#f1da97" opacity="0.85">
    <circle cx="222" cy="350" r="4"/><circle cx="250" cy="356" r="4"/><circle cx="278" cy="350" r="4"/>
    <circle cx="218" cy="382" r="4"/><circle cx="252" cy="388" r="4"/><circle cx="286" cy="380" r="4"/>
